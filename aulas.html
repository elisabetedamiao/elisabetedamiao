    .year h3 {
      color: #354f52;
      border-bottom: 2px solid #354f52;
      padding-bottom: 6px;
      margin-bottom: 18px;
      font-size: 1.4em;
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    li {
      background: white;
      margin: 12px 0;
      padding: 18px 20px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);

    a {
      color: #2f3e46;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9em;
      color: #666;
